<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <link rel="icon" href="favicon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <style>
        header {
            display: flex;
            justify-content: flex-end;
            padding: 34px 35px;       
        }

        .weather {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .temperature {
            margin: 0px;
            font-weight: bold;
            font-size: 32px;
            font-family: Afacad;
        }

        .city {
            margin: 0px;
            font-weight: bold;
            font-size: 20px;
            font-family: Afacad;
            color: #6E6CDF;
        }

        .main {
            display: flex;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            align-items: center;
            height: 60vh;
        }

        .time {
            margin: 0px;
            font-size: 74px;
            font-family: Afacad;
            font-weight: bold;
        }

        .gm {
            margin: 0px;
            font-size: 36px;
            font-family: Afacad;
            font-weight: bold;
            color: #6E6CDF;
        }

        .search {
            margin: 56px;
        }

        .searchBar {
            margin-bottom: 50px;
        }

        .labels {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 25px;
        }
    </style>
</head>
<body>
    <header>
        <div class="weather">
            <p class="temperature">-36°</p>
            <p class="city">Anadyr</p>
        </div>
    </header>

    <div class="main">
        <div class="greeting">
            <p class="time">09:11:01</p>
            <p class="gm">Good Morning, Danil.</p>
        </div>

        <div class="search">
            <div class="searchBar">
                <img src="searchBar.svg">
            </div>

            <div class="labels">
                <img src="labels/YT_label.svg">
                <img src="labels/GPT_label.svg">
                <img src="labels/GG_label.svg">
                <img src="labels/DS_label.svg">
                <img src="labels/GH_label.svg">
                <img src="labels/FB_label.svg">
                <img src="labels/Plus_label.svg">
            </div>
        </div>
    </div>
</body>
</html>
